
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12345a">
  <title>Livro de Ocorrências | Pátio Jardins</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login {
      width: 100%;
      max-width: 390px;
      background: white;
      padding: 30px 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px #00000015;
      text-align: center;
    }
    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      background: #12345a;
      color: white;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: bold;
    }
    h1 { color: #12345a; font-size: 23px; margin: 8px 0; }
    .subtitulo { color: #64748b; font-size: 14px; margin-bottom: 28px; }
    label {
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: bold;
      color: #334155;
      margin: 16px 0 7px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      background: #12345a;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
    }
    .aviso { color: #64748b; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="login">
    <div class="logo">PJ</div>
    <h1>Livro de Ocorrências</h1>
    <div class="subtitulo">Condomínio Pátio Jardins</div>

    <form id="loginForm">
      <label for="matricula">Matrícula</label>
      <input id="matricula" type="text"
        placeholder="Ex.: PJ0006" required>

      <label for="senha">Senha de acesso</label>
      <input id="senha" type="password"
        placeholder="Digite sua senha" required>

      <button type="submit">Entrar</button>
    </form> 
    

    <div class="aviso">
      Acesso exclusivo aos funcionários autorizados.
    </div>
  </main>

  <script type="module">
import  {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://bxtjucnnfuloalgtayts.supabase.co';

const SUPABASE_KEY = 'sb_publishable_GR2xfNu-eekN_Hi9TFWc5w_7UoSRjFn';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

alert('Conexão do aplicativo carregada!');

document.getElementById('loginForm').addEventListener('submit', async function(event) {
  event.preventDefault();

  const matricula = document.getElementById('matricula').value.trim().toLowerCase();
  const senha = document.getElementById('senha').value;

  const email = matricula + '@patiojardins.com';

  const botao = this.querySelector('button');
  botao.disabled = true;
  botao.textContent = 'Entrando...';

  const { data, error } = await supabase.auth.signInWithPassword({
    email: email,
    password: senha
  });

  botao.disabled = false;
  botao.textContent = 'Entrar';

  if (error) {
    alert('Não foi possível entrar. Confira sua matrícula e senha.');
    return;
  }
  mostrarPainel();
});
  


function mostrarPainel() {
  document.querySelector('.login').innerHTML = `
    <div class="logo">PJ</div>
    <h1>Painel do Funcionário</h1>
    <div class="subtitulo">Condomínio Pátio Jardins</div>
    <p>Bem-vindo ao Livro de Ocorrências Digital!</p>
    <button id="registrar">Registrar ocorrência</button>
    <button id="consultar">Consultar ocorrências</button>
    <button onclick="alert('Módulo em construção')">Conferir materiais</button>
    <button onclick="alert('Módulo em construção')">Compartilhar informações</button>
    <button id="sair">Sair do sistema</button>
  `;

  document.getElementById('registrar').addEventListener('click', mostrarFormulario);
  document.getElementById('consultar').addEventListener('click', consultarOcorrencias);

  document.getElementById('sair').addEventListener('click', async () => {
    await supabase.auth.signOut();
    location.reload();
  });
}
  
async function consultarOcorrencias() {
  const tela = document.querySelector('.login');

  tela.innerHTML = `
    <div class="logo">PJ</div>
    <h1>Consultar Ocorrências</h1>
    <div class="subtitulo">Condomínio Pátio Jardins</div>
    <label for="filtroPlantao">Filtrar por plantão:</label>

<select id="filtroPlantao">
  <option value="">Todos os plantões</option>
</select>
<label for="filtroCategoria">Filtrar por categoria:</label>

<select id="filtroCategoria">
  <option value="">Todas as categorias</option>
</select>
<button type="button" id="limparFiltros">
  Limpar filtros
</button>
    <div id="listaOcorrencias">Carregando ocorrências...</div>
    <button id="voltarPainel">Voltar ao painel</button>
  `;

  document.getElementById('voltarPainel')
    .addEventListener('click', mostrarPainel);

  
const { data, error } = await supabase
  .from('ocorrencias')
  .select('*')
  .order('created_at', { ascending: false })
  .limit(500);


  const lista = document.getElementById('listaOcorrencias');
  lista.innerHTML = '';

  if (error) {
    lista.textContent = 'Erro ao consultar: ' + error.message;
    return;
  }

  if (!data || data.length === 0) {
    lista.textContent = 'Nenhuma ocorrência encontrada.';
    return;
  }
  
  const idsPlantoes = [...new Set(data.map(item => item.plantao_id).filter(Boolean))];
  const idsCategorias = [...new Set(data.map(item => item.categoria_id).filter(Boolean))];

  const { data: plantoes, error: erroPlantoes } = await supabase
  .from('plantoes')
  .select('id, numero, nome')
  .eq('ativo', true);

  const { data: categorias, error: erroCategorias } = await supabase
  .from('categorias')
  .select('id, nome')
  .eq('ativo', true);

  if (erroPlantoes || erroCategorias) {
    alert('Erro ao buscar nomes dos plantões ou categorias.');
    return;
  }

  const nomesPlantoes = new Map(
    plantoes.map(item => [
      item.id,
      item.nome || `Plantão ${item.numero}`
    ])
  );
  const filtroPlantao = document.getElementById('filtroPlantao');

plantoes.forEach(plantao => {
  const opcao = document.createElement('option');
  opcao.value = plantao.id;
  opcao.textContent = plantao.nome || `Plantão ${plantao.numero}`;
  filtroPlantao.appendChild(opcao);
});

  const nomesCategorias = new Map(
    categorias.map(item => [item.id, item.nome])
  );
  const filtroCategoria = document.getElementById('filtroCategoria');

categorias.forEach(categoria => {
  const opcao = document.createElement('option');
  opcao.value = categoria.id;
  opcao.textContent = categoria.nome;
  filtroCategoria.appendChild(opcao);
});
  
const idsUsuarios = [...new Set(
  data.map(item => item.usuario_id).filter(Boolean)
)];

const { data: usuarios, error: erroUsuarios } = await supabase
  .from('perfis')
  .select('id, nome')
  .in('id', idsUsuarios);

if (erroUsuarios) {
  alert('Erro ao buscar nomes dos funcionários: ' + erroUsuarios.message);
  return;
}

const nomesUsuarios = new Map(
  usuarios.map(item => [item.id, item.nome])
);
      


  function renderizarOcorrencias() {
  lista.innerHTML = '';

  const plantaoSelecionado = filtroPlantao.value;
  const categoriaSelecionada = filtroCategoria.value;

  const ocorrenciasFiltradas = data.filter(item =>
    (!plantaoSelecionado || String(item.plantao_id) === plantaoSelecionado) &&
    (!categoriaSelecionada || String(item.categoria_id) === categoriaSelecionada)
  );

  ocorrenciasFiltradas.forEach(item => {
    const card = document.createElement('div');

    card.style.cssText = `
      background: #f1f5f9;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      text-align: left;
    `;

    const titulo = document.createElement('strong');
    titulo.textContent = 'Ocorrência registrada';

    
    const detalhes = document.createElement('p');

    detalhes.textContent =
      'Data: ' + (item.created_at
        ? new Date(item.created_at).toLocaleString('pt-BR', {
            timeZone: 'America/Bahia',
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          })
        : 'Não informada') +
      '\nFuncionário: ' + (nomesUsuarios.get(item.usuario_id) || 'Não identificado') +
      '\nPlantão: ' + (nomesPlantoes.get(item.plantao_id) || 'Não informado') +
'\nCategoria: ' + (nomesCategorias.get(item.categoria_id) || 'Não informada') +
      '\nDescrição: ' + (item.descricao || '') +
      '\nObservação: ' + (item.observacao || '');

    detalhes.style.whiteSpace = 'pre-line';


    card.appendChild(titulo);
    card.appendChild(detalhes);
        lista.appendChild(card);
  });
}

filtroCategoria.addEventListener('change', renderizarOcorrencias);

document.getElementById('limparFiltros').addEventListener('click', () => {
  filtroPlantao.value = '';
  filtroCategoria.value = '';
  renderizarOcorrencias();
});
}

async function mostrarFormulario() {
  document.querySelector('.login').innerHTML = `
    <div class="logo">PJ</div>
    <h1>Registrar ocorrência</h1>
    <div class="subtitulo">Condomínio Pátio Jardins</div>

    <form id="formOcorrencia">
      <label>Plantão</label>
      <select id="plantao" required>
        <option value="">Selecione o plantão</option>
      </select>

      <label>Categoria</label>
      <select id="categoria" required>
        <option value="">Selecione a categoria</option>
      </select>

      <label>Descrição</label>
      <textarea id="descricao" required placeholder="Descreva a ocorrência"></textarea>

      <label>Observação / Liberação</label>
      <textarea id="observacao" placeholder="Informações adicionais"></textarea>

      <p>Área: Portaria</p>
      <button type="submit">Salvar ocorrência</button>
      <button type="button" id="voltar">Voltar ao painel</button>
    </form>
  `;

  const { data: categorias, error } = await supabase
    .from('categorias')
    .select('id, nome')
    .eq('ativo', true)
    .order('nome');

  const campoCategoria = document.getElementById('categoria');

  if (error) {
    alert('Erro ao carregar categorias: ' + error.message);
  } else {
    categorias.forEach((item) => {
      const opcao = document.createElement('option');
      opcao.value = item.id;
      opcao.textContent = item.nome;
      campoCategoria.appendChild(opcao);
    });
  }
const { data: usuarioAtual, error: erroUsuario } = await supabase.auth.getUser();

if (erroUsuario || !usuarioAtual.user) {
  alert('Não foi possível identificar o funcionário conectado.');
  return;
}

const { data: perfil, error: erroPerfil } = await supabase
  .from('perfis')
  .select('id')
  .eq('auth_user_id', usuarioAtual.user.id)
  .eq('ativo', true)
  .single();

if (erroPerfil || !perfil) {
  alert('Erro ao localizar o perfil do funcionário.');
  return;
}

const { data: vinculos, error: erroVinculos } = await supabase
  .from('plantao_usuarios')
  .select('plantao_id')
  .eq('usuario_id', perfil.id)
  .eq('ativo', true);

if (erroVinculos || !vinculos || vinculos.length === 0) {
  alert('Nenhum plantão ativo encontrado para este funcionário.');
  return;
}

const idsPlantoes = vinculos.map(item => item.plantao_id);

const { data: plantoes, error: erroPlantoes } = await supabase
  .from('plantoes')
  .select('id, numero, nome')
  .in('id', idsPlantoes)
  .eq('ativo', true)
  .order('numero');

if (!plantoes || plantoes.length === 0) {
  alert('Nenhum plantão ativo disponível.');
  return;
}

const campoPlantao = document.getElementById('plantao');

plantoes.forEach(item => {
  const opcao = document.createElement('option');
  opcao.value = item.id;
  opcao.textContent = item.nome || `Plantão ${item.numero}`;
  campoPlantao.appendChild(opcao);
});
  const campoDescricao = document.getElementById('descricao');
const campoObservacao = document.getElementById('observacao');

let carregamentoRascunho = 0;

campoPlantao.addEventListener('change', async () => {
  const plantaoId = campoPlantao.value;
  const tentativa = ++carregamentoRascunho;

  campoDescricao.value = '';
  campoObservacao.value = '';

  if (!plantaoId) return;

  const { data, error } = await supabase
    .from('rascunhos_ocorrencias')
    .select('descricao, observacao')
    .eq('plantao_id', plantaoId)
    .maybeSingle();

  if (tentativa !== carregamentoRascunho) return;

  if (error) {
    alert('Erro ao recuperar rascunho: ' + error.message);
    return;
  }

  if (data) {
    campoDescricao.value = data.descricao || '';
    campoObservacao.value = data.observacao || '';
  }
});
  document.getElementById('voltar').addEventListener('click', () => {
  mostrarPainel();
});

  document.getElementById('formOcorrencia').addEventListener('submit', async (event) => {
  event.preventDefault();

  const botao = event.currentTarget.querySelector('button[type="submit"]');
  botao.disabled = true;
  botao.textContent = 'Salvando...';

  const plantao_id = document.getElementById('plantao').value;
  const categoria_id = document.getElementById('categoria').value;
  const descricao = document.getElementById('descricao').value.trim();
  const observacao = document.getElementById('observacao').value.trim();

  const { error } = await supabase
    .from('ocorrencias')
    .insert({
      plantao_id: plantao_id,
      categoria_id: categoria_id,
      usuario_id: perfil.id,
      descricao: descricao,
      observacao: observacao,
      area: 'Portaria'
    });

  botao.disabled = false;
  botao.textContent = 'Salvar ocorrência';

  if (error) {
    alert('Erro ao salvar ocorrência: ' + error.message);
    return;
  }

    alert('Ocorrência registrada com sucesso!');
  document.getElementById('formOcorrencia').reset();
});
    }
</script>
</body>
</html>
