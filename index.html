    async function mostrarMateriais() {
  const tela = document.querySelector('.login');

  tela.innerHTML = `
    <div class="logo">PJ</div>
    <h1>Conferência de Materiais</h1>
    <div class="subtitulo">Condomínio Pátio Jardins</div>
<div id="campoPlantaoMateriais">

        <button id="voltarMateriais">Voltar ao painel</button>
    <button id="salvarMateriais">Salvar conferência</button>
  `;
        const materiais = [
    'Computador completo',
    'Porteiro eletrônico',
    'Rádio HT',
    'Carregador de rádio HT',
    'Bateria de rádio HT',
    'Controle do portão de entrada/saída de veículos',
    'Controle da cancela de entrada de moradores',
    'Botoeira de entrada de veículos visitantes/saída de veículos',
    'Telefone corporativo',
    'Interfone ramal 94/500',
    'Tablet com carregador',
    'Acesso ao Nextin',
    'Câmeras',
    'Chave do entreposto',
    'Chaves das cancelas',
    'Extintor',
    'Ar-condicionado com controle',
    'Bebedouro'
  ];

  const lista = document.getElementById('listaMateriais');
const campoPlantaoMateriais = document.getElementById('plantaoMateriais');
const botaoSalvarMateriais = document.getElementById('salvarMateriais');

const { data: usuarioAtual, error: erroUsuario } =
  await supabase.auth.getUser();

if (erroUsuario || !usuarioAtual.user) {
  alert('Não foi possível identificar o funcionário.');
  return;
}

const { data: perfilMateriais, error: erroPerfil } = await supabase
  .from('perfis')
  .select('id')
  .eq('auth_user_id', usuarioAtual.user.id)
  .eq('ativo', true)
  .maybeSingle();

if (erroPerfil || !perfilMateriais) {
  alert('Não foi possível localizar o perfil do funcionário.');
  return;
}

const { data: vinculosMateriais, error: erroVinculos } = await supabase
  .from('plantao_usuarios')
  .select('plantao_id')
  .eq('usuario_id', perfilMateriais.id)
  .eq('ativo', true);

if (erroVinculos || !vinculosMateriais || vinculosMateriais.length === 0) {
  alert('Nenhum plantão ativo vinculado ao funcionário.');
  return;
}

const idsPlantoes = vinculosMateriais.map(item => item.plantao_id);

const { data: plantoesMateriais, error: erroPlantoes } = await supabase
  .from('plantoes')
  .select('id, nome')
  .eq('ativo', true)
  .in('id', idsPlantoes);

if (erroPlantoes) {
  alert('Erro ao carregar plantões: ' + erroPlantoes.message);
  return;
}

campoPlantaoMateriais.innerHTML =
  '<option value="">Selecione o plantão</option>';

plantoesMateriais.forEach(plantao => {
  campoPlantaoMateriais.innerHTML +=
    `<option value="${plantao.id}">${plantao.nome}</option>`;
});
  materiais.forEach((material, indice) => {
    lista.innerHTML += `
      <div class="material-item" data-material="${material}">
        <h3>${indice + 1}. ${material}</h3>

        <label>Quantidade</label>
        <input type="number" class="quantidade-material" min="0" value="1">

        <label>Estado</label>
        <select class="estado-material">
          <option value="Bom">Bom</option>
          <option value="Ruim">Ruim</option>
        </select>

        <label>Observação</label>
        <textarea class="observacao-material" placeholder="Observações, se necessário"></textarea>
      </div>
    `;
  });

  lista.innerHTML += `
    <div class="material-item" data-material="OUTROS">
      <h3>19. OUTROS</h3>
      <input type="text" class="nome-outro-material" placeholder="Nome do material">
      <label>Quantidade</label>
      <input type="number" class="quantidade-material" min="0" value="1">
      <label>Estado</label>
      <select class="estado-material">
  <option value="Bom">Bom</option>
  <option value="Ruim">Ruim</option>
</select>
      <label>Observação</label>
      <textarea class="observacao-material" placeholder="Observações"></textarea>
    </div>
  `;
        document.getElementById('voltarMateriais').addEventListener('click', () => {
    mostrarPainel();
  });
      botaoSalvarMateriais.addEventListener('click', async () => {
        alert('Botão Salvar foi acionado!');
  const plantao_id = campoPlantaoMateriais.value;

  if (!plantao_id) {
    alert('Selecione o plantão.');
    return;
  }

  const itens = [...lista.querySelectorAll('.material-item')]
    .map(item => {
      const nome = item.dataset.material === 'OUTROS'
        ? item.querySelector('.nome-outro-material').value.trim()
        : item.dataset.material;

      if (!nome) return null;

      return {
        nome_material: nome,
        quantidade: Number(item.querySelector('.quantidade-material').value),
        estado: item.querySelector('.estado-material').value,
        observacao: item.querySelector('.observacao-material').value.trim()
      };
        }).filter(Boolean);

  if (itens.length === 0) {
    alert('Nenhum material informado.');
    return;
  }

  if (itens.some(item =>
    !Number.isInteger(item.quantidade) || item.quantidade < 0
  )) {
    alert('Confira as quantidades dos materiais.');
    return;
  }

  botaoSalvarMateriais.disabled = true;
  botaoSalvarMateriais.textContent = 'Salvando...';

  const { data: conferencia, error: erroConferencia } = await supabase
    .from('Conferencia_materiais')
    .insert({
      plantao_id: plantao_id,
      usuario_id: perfilMateriais.id
    })
    .select('id')
    .single();

  if (erroConferencia) {
    alert('Erro ao salvar conferência: ' + erroConferencia.message);
    botaoSalvarMateriais.disabled = false;
    botaoSalvarMateriais.textContent = 'Salvar conferência';
    return;
  }

  const itensParaSalvar = itens.map(item => ({
    ...item,
    conferencia_id: conferencia.id
  }));

  const { error: erroItens } = await supabase
    .from('itens_conferencia_materiais')
    .insert(itensParaSalvar);

  if (erroItens) {
    alert('A conferência foi criada, mas houve erro ao salvar os materiais: ' + erroItens.message);
    botaoSalvarMateriais.disabled = false;
    botaoSalvarMateriais.textContent = 'Salvar conferência';
    return;
  }

  alert('Conferência de materiais salva com sucesso!');
  botaoSalvarMateriais.disabled = false;
  botaoSalvarMateriais.textContent = 'Salvar conferência';
});
}

        const filtroDataHistorico = document.getElementById('filtroDataHistorico');

  const { data: conferencias, error } = await supabase
    .from('Conferencia_materiais')
    .select('*')

    .limit(200);

  if (error) {
    lista.textContent = 'Erro ao carregar histórico: ' + error.message;
    return;
  }

  if (!conferencias || conferencias.length === 0) {
    lista.textContent = 'Nenhuma conferência registrada.';
    return;
  }

  const idsConferencias = conferencias.map(item => item.id);
const idsUsuarios = [...new Set(conferencias.map(item => item.usuario_id))];
const idsPlantoes = [...new Set(conferencias.map(item => item.plantao_id))];

const { data: materiaisHistorico, error: erroMateriais } = await supabase
  .from('itens_conferencia_materiais')
  .select('*')
  .in('conferencia_id', idsConferencias);

const { data: usuariosHistorico, error: erroUsuarios } = await supabase
  .from('perfis')
  .select('id, nome')
  .in('id', idsUsuarios);

const { data: plantoesHistorico, error: erroPlantoes } = await supabase
  .from('plantoes')
  .select('id, nome, numero')
  .order('numero', { ascending: true });

if (erroMateriais || erroUsuarios || erroPlantoes) {
  lista.textContent = 'Erro ao carregar os detalhes do histórico.';
  return;
}

const nomesUsuarios = new Map(
  usuariosHistorico.map(item => [item.id, item.nome])
);
usuariosHistorico.forEach(usuario => {
  const opcao = document.createElement('option');
  opcao.value = usuario.id;
  opcao.textContent = usuario.nome;
  filtroFuncionarioHistorico.appendChild(opcao);
});
const nomesPlantoes = new Map(
  plantoesHistorico.map(item => [
    item.id,
    item.nome || `Plantão ${item.numero}`
  ])
);
        plantoesHistorico.forEach(plantao => {
  const opcao = document.createElement('option');
  opcao.value = plantao.id;
  opcao.textContent = plantao.nome || `Plantão ${plantao.numero}`;
  filtroPlantaoHistorico.appendChild(opcao);
});
lista.innerHTML = '';
const conferenciasFiltradas = () => {
  const plantaoSelecionado = filtroPlantaoHistorico.value;
  const dataSelecionada = filtroDataHistorico.value;
  const funcionarioSelecionado = filtroFuncionarioHistorico.value;

  return conferencias.filter(conferencia => {
    const correspondePlantao =
      !plantaoSelecionado ||
      String(conferencia.plantao_id) === plantaoSelecionado;

    const correspondeFuncionario =
      !funcionarioSelecionado ||
      String(conferencia.usuario_id) === funcionarioSelecionado;

    const dataConferencia = new Date(conferencia.created_at)
      .toLocaleDateString('en-CA', {
        timeZone: 'America/Bahia'
      });

    const correspondeData =
      !dataSelecionada ||
      dataConferencia === dataSelecionada;

    return correspondePlantao &&
      correspondeFuncionario &&
      correspondeData;
  });
};

function renderizarHistoricoMateriais() {
  lista.innerHTML = '';

  conferenciasFiltradas().forEach(conferencia => {
  const card = document.createElement('div');

  card.style.cssText = `
    background: #f1f5f9;
    padding: 15px;
    margin: 12px 0;
    border-radius: 10px;
    text-align: left;
  `;

  const titulo = document.createElement('strong');
  titulo.textContent = 'Conferência de materiais';

  const detalhes = document.createElement('p');
  detalhes.textContent =
    'Data: ' + new Date(conferencia.created_at).toLocaleString('pt-BR') +
    '\nFuncionário: ' + (nomesUsuarios.get(conferencia.usuario_id) || 'Não identificado') +
    '\nPlantão: ' + (nomesPlantoes.get(conferencia.plantao_id) || 'Não informado');

  detalhes.style.whiteSpace = 'pre-line';

  card.appendChild(titulo);
  card.appendChild(detalhes);

  const itensDaConferencia = materiaisHistorico.filter(
    item => item.conferencia_id === conferencia.id
  );

  itensDaConferencia.forEach(item => {
    const material = document.createElement('p');

    material.textContent =
      item.nome_material +
      ' | Quantidade: ' + item.quantidade +
      ' | Estado: ' + item.estado +
      (item.observacao ? ' | Observação: ' + item.observacao : '');

    card.appendChild(material);
  });

  lista.appendChild(card);
});
}

filtroPlantaoHistorico.addEventListener('change', renderizarHistoricoMateriais);

renderizarHistoricoMateriais();
filtroDataHistorico.addEventListener('change', renderizarHistoricoMateriais);

filtroFuncionarioHistorico.addEventListener('change', renderizarHistoricoMateriais);

  const categoriaSelecionada = filtroCategoria.value;

  const ocorrenciasFiltradas = data.filter(item =>
    (!plantaoSelecionado || String(item.plantao_id) === plantaoSelecionado) &&
    (!categoriaSelecionada || String(item.categoria_id) === categoriaSelecionada)
  );

  ocorrenciasFiltradas.forEach(item => {
    const card = document.createElement('div');

    card.style.cssText = `
      background: #f1f5f9;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      text-align: left;
    `;

    const titulo = document.createElement('strong');
    titulo.textContent = 'Ocorrência registrada';

    
    const detalhes = document.createElement('p');

    detalhes.textContent =
      'Data: ' + (item.created_at
        ? new Date(item.created_at).toLocaleString('pt-BR', {
            timeZone: 'America/Bahia',
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          })
        : 'Não informada') +
      '\nFuncionário: ' + (nomesUsuarios.get(item.usuario_id) || 'Não identificado') +
      '\nPlantão: ' + (nomesPlantoes.get(item.plantao_id) || 'Não informado') +
'\nCategoria: ' + (nomesCategorias.get(item.categoria_id) || 'Não informada') +
      '\nDescrição: ' + (item.descricao || '') +
      '\nObservação: ' + (item.observacao || '');

    detalhes.style.whiteSpace = 'pre-line';


    card.appendChild(titulo);
    card.appendChild(detalhes);
        lista.appendChild(card);
  });
}

filtroCategoria.addEventListener('change', renderizarOcorrencias);

document.getElementById('limparFiltros').addEventListener('click', () => {
  filtroPlantao.value = '';
  filtroCategoria.value = '';
  renderizarOcorrencias();
});
}

async function mostrarFormulario() {
  document.querySelector('.login').innerHTML = `
    <div class="logo">PJ</div>
    <h1>Registrar ocorrência</h1>
    <div class="subtitulo">Condomínio Pátio Jardins</div>

    <form id="formOcorrencia">
      <label>Plantão</label>
      <select id="plantao" required>
        <option value="">Selecione o plantão</option>
      </select>

      <label>Categoria</label>
      <select id="categoria" required>
        <option value="">Selecione a categoria</option>
      </select>

      <label>Descrição</label>
      <textarea id="descricao" required placeholder="Descreva a ocorrência"></textarea>

      <label>Observação / Liberação</label>
      <textarea id="observacao" placeholder="Informações adicionais"></textarea>

      <p>Área: Portaria</p>
      <button type="submit">Salvar ocorrência</button>
      <button type="button" id="voltar">Voltar ao painel</button>
    </form>
  `;

  const { data: categorias, error } = await supabase
    .from('categorias')
    .select('id, nome')
    .eq('ativo', true)
    .order('nome');

  const campoCategoria = document.getElementById('categoria');

  if (error) {
    alert('Erro ao carregar categorias: ' + error.message);
  } else {
    categorias.forEach((item) => {
      const opcao = document.createElement('option');
      opcao.value = item.id;
      opcao.textContent = item.nome;
      campoCategoria.appendChild(opcao);
    });
  }
const { data: usuarioAtual, error: erroUsuario } = await supabase.auth.getUser();

if (erroUsuario || !usuarioAtual.user) {
  alert('Não foi possível identificar o funcionário conectado.');
  return;
}

const { data: perfil, error: erroPerfil } = await supabase
  .from('perfis')
  .select('id')
  .eq('auth_user_id', usuarioAtual.user.id)
  .eq('ativo', true)
  .single();

if (erroPerfil || !perfil) {
  alert('Erro ao localizar o perfil do funcionário.');
  return;
}

const { data: vinculos, error: erroVinculos } = await supabase
  .from('plantao_usuarios')
  .select('plantao_id')
  .eq('usuario_id', perfil.id)
  .eq('ativo', true);

if (erroVinculos || !vinculos || vinculos.length === 0) {
  alert('Nenhum plantão ativo encontrado para este funcionário.');
  return;
}

const idsPlantoes = vinculos.map(item => item.plantao_id);

const { data: plantoes, error: erroPlantoes } = await supabase
  .from('plantoes')
  .select('id, numero, nome')
  .in('id', idsPlantoes)
  .eq('ativo', true)
  .order('numero');

if (!plantoes || plantoes.length === 0) {
  alert('Nenhum plantão ativo disponível.');
  return;
}

const campoPlantao = document.getElementById('plantao');

plantoes.forEach(item => {
  const opcao = document.createElement('option');
  opcao.value = item.id;
  opcao.textContent = item.nome || `Plantão ${item.numero}`;
  campoPlantao.appendChild(opcao);
});
  const campoDescricao = document.getElementById('descricao');
const campoObservacao = document.getElementById('observacao');

let carregamentoRascunho = 0;

campoPlantao.addEventListener('change', async () => {
  const plantaoId = campoPlantao.value;
  const tentativa = ++carregamentoRascunho;

  campoDescricao.value = '';
  campoObservacao.value = '';

  if (!plantaoId) return;

  const { data, error } = await supabase
    .from('rascunhos_ocorrencias')
    .select('descricao, observacao')
    .eq('plantao_id', plantaoId)
    .maybeSingle();

  if (tentativa !== carregamentoRascunho) return;

  if (error) {
    alert('Erro ao recuperar rascunho: ' + error.message);
    return;
  }

  if (data) {
    campoDescricao.value = data.descricao || '';
    campoObservacao.value = data.observacao || '';
  }
});
  document.getElementById('voltar').addEventListener('click', () => {
  mostrarPainel();
});
let temporizadorRascunho;

async function salvarRascunho(plantaoId, descricao, observacao) {
  if (!plantaoId) return;

  const { error } = await supabase
    .from('rascunhos_ocorrencias')
    .upsert({
      plantao_id: plantaoId,
      descricao: descricao,
      observacao: observacao,
      atualizado_por: perfil.id,
      updated_at: new Date().toISOString()
    }, {
      onConflict: 'plantao_id'
    });

  if (error) {
    console.error('Erro ao salvar rascunho:', error);
  }
}

function programarSalvamentoRascunho() {
  clearTimeout(temporizadorRascunho);

  const plantaoId = campoPlantao.value;
  const descricao = campoDescricao.value;
  const observacao = campoObservacao.value;

  temporizadorRascunho = setTimeout(() => {
    salvarRascunho(plantaoId, descricao, observacao);
  }, 1000);
}

campoDescricao.addEventListener('input', programarSalvamentoRascunho);
campoObservacao.addEventListener('input', programarSalvamentoRascunho);
  document.getElementById('formOcorrencia').addEventListener('submit', async (event) => {
  event.preventDefault();

  const botao = event.currentTarget.querySelector('button[type="submit"]');
  botao.disabled = true;
  botao.textContent = 'Salvando...';

  const plantao_id = document.getElementById('plantao').value;
  const categoria_id = document.getElementById('categoria').value;
  const descricao = document.getElementById('descricao').value.trim();
  const observacao = document.getElementById('observacao').value.trim();
    clearTimeout(temporizadorRascunho);

  const { error } = await supabase
    .from('ocorrencias')
    .insert({
      plantao_id: plantao_id,
      categoria_id: categoria_id,
      usuario_id: perfil.id,
      descricao: descricao,
      observacao: observacao,
      area: 'Portaria'
    });

  botao.disabled = false;
  botao.textContent = 'Salvar ocorrência';

  if (error) {
  await salvarRascunho(plantao_id, descricao, observacao);
  alert('Erro ao salvar ocorrência: ' + error.message);
  return;
  }
const { error: erroRascunho } = await supabase
  .from('rascunhos_ocorrencias')
  .delete()
  .eq('plantao_id', plantao_id);

if (erroRascunho) {
  alert('A ocorrência foi registrada, mas não foi possível limpar o rascunho: ' + erroRascunho.message);
    }
    alert('Ocorrência registrada com sucesso!');
  document.getElementById('formOcorrencia').reset();
});
    }
</script>

</html>
