
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12345a">
  <title>Livro de Ocorrências | Pátio Jardins</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login {
      width: 100%;
      max-width: 390px;
      background: white;
      padding: 30px 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px #00000015;
      text-align: center;
    }
    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      background: #12345a;
      color: white;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: bold;
    }
    h1 { color: #12345a; font-size: 23px; margin: 8px 0; }
    .subtitulo { color: #64748b; font-size: 14px; margin-bottom: 28px; }
    label {
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: bold;
      color: #334155;
      margin: 16px 0 7px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      background: #12345a;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
    }
    .aviso { color: #64748b; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="login">
    <div class="logo">PJ</div>
    <h1>Livro de Ocorrências</h1>
    <div class="subtitulo">Condomínio Pátio Jardins</div>

    <form id="loginForm">
      <label for="matricula">Matrícula</label>
      <input id="matricula" type="text"
        placeholder="Ex.: PJ0006" required>

      <label for="senha">Senha de acesso</label>
      <input id="senha" type="password"
        placeholder="Digite sua senha" required>

      <button type="submit">Entrar</button>
    </form>

    <div class="aviso">
      Acesso exclusivo aos funcionários autorizados.
    </div>
  </main>

  <script type="module">
    
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://bxtjucnnfuloalgtayts.supabase.co';

const SUPABASE_KEY = 'sb_publishable_GR2xfNu-eekN_Hi9TFWc5w_7UoSRjFn';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById('loginForm').addEventListener('submit', async function(event) {
  event.preventDefault();

  const matricula = document.getElementById('matricula').value.trim().toLowerCase();
  const senha = document.getElementById('senha').value;

  const email = matricula + '@patiojardins.com';

  const botao = this.querySelector('button');
  botao.disabled = true;
  botao.textContent = 'Entrando...';

  const { data, error } = await supabase.auth.signInWithPassword({
    email: email,
    password: senha
  });

  botao.disabled = false;
  botao.textContent = 'Entrar';

  if (error) {
    alert('Não foi possível entrar. Confira sua matrícula e senha.');
    return;
  }

  alert('Autenticação realizada com sucesso! Próxima etapa: abrir o painel do funcionário.');
});
    
  </script>
</body>
</html>
